aid: freeverse
name: Freeverse
description: >-
  Freeverse is the team behind the LAOS Network, an EVM-compatible Polkadot
  parachain and public blockchain protocol for Bridgeless Minting and Evolution
  of digital assets (NFTs). Rather than bridging tokens between chains, LAOS lets
  applications mint and dynamically evolve NFTs whose ownership is enforced on
  established chains such as Ethereum and Polygon while the asset logic and gas
  costs live on LAOS. The LAOS Foundation maintains a public GraphQL API at
  api.laosnetwork.io that lets developers create collections, mint up to 700 NFTs
  in a single atomic operation, evolve existing assets, broadcast assets to
  marketplaces, and run read queries over an on-chain indexer. Read queries are
  open; write mutations require an API key. Freeverse originated as a Barcelona
  blockchain gaming and digital-ownership company (Living Assets, Crypto-soccer)
  and is a portfolio company of Earlybird Venture Capital.
